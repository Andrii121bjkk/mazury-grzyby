ase(),age=+p.spec_age||0,h=x[2].includes(site)?1:(site[0]==='B'?.45:.25),tree=x[1][host]??(Object.keys(x[1]).length?.35:.7),a=age>=x[3]&&age<=x[4]?1:.5,cond=$('condition').value,wet=/W$/.test(site),m=cond==='wet'?(wet?1:.75):cond==='dry'?(wet?.7:1):(wet?.9:1),f=.7;if(weather){let c=weather.current||{};f=.6*Math.max(0,1-Math.abs(+(c.soil_temperature_0_to_7cm||12)-14)/20)+.4*Math.max(0,1-Math.abs(+(c.soil_moisture_0_to_7cm||.2)-.2)/.5)}return Math.round(100*(.32*h+.22*tree+.2*a+.16*m+.1*f))}function col(s){return s>78?'#b52b27':s>62?'#e67e34':s>45?'#efd257':s>28?'#90c579':'#d5e7bf'}function center(f){return L.geoJSON(f).getBounds().getCenter()}function draw(){group.clearLayers();features.forEach(f=>{f.score=score(f.properties||{});let g=L.geoJSON(f,{style:{color:col(f.score),weight:1,fillOpacity:.55,fillColor:col(f.score)}});g.on('click',()=>select(f));g.addTo(group)});message(features.length?'Знайдено лісових виділів: '+features.length:'На цій ділянці немає даних. Пересунь карту або наблизь.')}async function load(){if(busy||map.getZoom()<9)return;busy=true;let b=map.getBounds(),q=[b.getWest()-.02,b.getSouth()-.02,b.getEast()+.02,b.getNorth()+.02].join(',');message('Завантажую дані лісових виділів BDL…');try{let r=await fetch('/api/bdl?bbox='+encodeURIComponent(q)+'&max=1500'),j=await r.json();if(!r.ok)throw Error();let raw=j.features||[];features=raw.filter(f=>{let p=f.properties||{};return String(p.area_type||'').toUpperCase()==='D-STAN'&&(+p.sub_area||0)>0&&!/REZERW|OSTOJA|BADAW|NATURA/i.test((p.prot_categ||'')+' '+(p.forest_fun||''))});draw();if(!features.length)message('BDL отримав '+raw.length+' записів; придатних ділянок — 0.')}catch(e){message('BDL тимчасово недоступний. Спробуй оновити карту пізніше.')}finally{busy=false}}map.on('moveend',()=>{clearTimeout(window.lt);window.lt=setTimeout(load,400)});function select(f){let p=f.properties||{},c=center(f),dest=c.lat+','+c.lng;let origin=user?'&origin='+user.lat+','+user.lng:'';$('kicker').textContent=p.nazwa||'Лісовий виділ';$('title').textContent=p.adr_for||'Виділ BDL';$('body').innerHTML='<p><b>🍄 '+f.score+'/100</b> · модельна оцінка</p><p>Тип лісу: <b>'+(p.site_type||'—')+'</b><br>Порода: <b>'+(p.species_cd||'—')+'</b><br>Вік: <b>'+(p.spec_age||'—')+' років</b><br>Площа: <b>'+(+p.sub_area||0).toFixed(2)+' га</b></p><p class="small">Це орієнтовна підказка за характеристиками лісу та погодою, не гарантія грибів. Перевіряй знаки й актуальні заборони входу.</p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+dest+origin+'&travelmode=driving">🚗 Маршрут у Google Maps</a><br><span class="small">'+dest+'</span>';$('sheet').classList.add('show')}$('close').onclick=()=> $('sheet').classList.remove('show');$('condition').onchange=draw;$('layers').onclick=()=>document.querySelector('.leaflet-control-layers-toggle')?.click();$('gps').onclick=()=>map.locate({setView:true,maxZoom:13,enableHighAccuracy:true});map.on('locationfound',e=>{user=e.latlng;L.circleMarker(e.latlng,{radius:8,color:'#1574c8'}).addTo(map)});map.on('locationerror',()=>message('GPS недоступний. Перевір дозвіл геолокації браузера.'));$('best').onclick=()=>{if(!features.length){message('Спершу збільш карту над лісом.');return}let f=features.slice().sort((a,b)=>b.score-a.score)[0];map.fitBounds(L.geoJSON(f).getBounds(),{maxZoom:15});select(f)};async function getWeather(){try{let r=await fetch('/api/weather?lat=52.2297&lon=21.0122'),j=await r.json();if(!r.ok)throw Error();weather=j;let c=j.current||{},h=j.hourly||{},cut=Date.now()-604800000,rain=(h.time||[]).reduce((n,t,i)=>n+(new Date(t).getTime()>=cut?+(h.precipitation?.[i]||0):0),0);$('temp').textContent=Math.round(c.temperature_2m||0)+'°C';$('soil').textContent=Math.round((c.soil_moisture_0_to_7cm||0)*100)+'%';$('stemp').textContent=(+(c.soil_temperature_0_to_7cm||0)).toFixed(1)+'°';$('rain').textContent=rain.toFixed(1)+' mm';draw()}catch{$('temp').textContent='Погода недоступна'}}getWeather();load();if('serviceWorker'in
